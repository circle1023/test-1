<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수업 한 장 — AI 수업지도안</title>
<style>
:root{font-family:system-ui,-apple-system,'맑은 고딕',sans-serif;color:#203d36;background:#f4f6f2;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:42px 24px}header{margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:750;color:#567769}h1{font-size:34px;letter-spacing:-1.5px;margin:10px 0}header p{color:#64756f;line-height:1.7;margin:0}.layout{display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}.card{background:white;border:1px solid #dde5de;border-radius:20px;padding:26px;box-shadow:0 8px 28px #24423305}h2{font-size:18px;margin:0 0 22px}.number{color:#6a897b;margin-right:9px;font-size:13px}label{display:block;font-weight:650;font-size:14px;margin:20px 0 8px}input,textarea{width:100%;border:1px solid #ced9d2;background:#fcfdfb;color:#243c34;border-radius:10px;padding:12px;font:inherit;font-size:14px;line-height:1.65}input:focus,textarea:focus{outline:3px solid #cce5d8;border-color:#36775b}textarea{resize:vertical}input[readonly]{background:#f0f4ee;color:#506a5f}.hint{font-size:12px;line-height:1.6;color:#738278;margin:8px 0}.keyrow{display:flex;gap:6px}.keyrow input{min-width:0}.keyrow button{padding:8px 10px;white-space:nowrap;font-size:12px}button{border:0;border-radius:10px;padding:12px 17px;font:inherit;font-size:14px;font-weight:650;cursor:pointer;background:#eaf0e9;color:#315543}button:hover{filter:brightness(.96)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#275b46;color:white;width:100%;margin-top:24px;padding:15px}.resulthead{display:flex;align-items:center;justify-content:space-between;gap:12px}.resulthead h2{margin:0}.badge{font-size:11px;color:#547760;background:#eef4eb;padding:6px 9px;border-radius:20px}.steps{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 18px}.steps span{font-size:12px;background:#f2f5ef;padding:6px 10px;border-radius:6px;color:#6b7e70}#result{min-height:570px;line-height:1.9;background:#fff;border-color:#e2e9df;padding:18px;font-size:14px}#result::placeholder{color:#87968b}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}#status{font-size:13px;line-height:1.7;margin:14px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}#status.error{color:#a63834}.footnote{font-size:12px;color:#7d897f;text-align:center;margin-top:25px}a{color:#367657}#cancel{width:100%;margin-top:8px}[hidden]{display:none!important}@media(max-width:800px){main{padding:26px 16px}.layout{grid-template-columns:1fr}.card{padding:22px}h1{font-size:29px}#result{min-height:470px}}
</style>
</head>
<body><main>
<header><div class="eyebrow">LESSON PLANNER</div><h1>수업 한 장</h1><p>수업의 시작부터 마무리까지.<br>학년과 주제를 입력하면, 다섯 단계의 수업지도안 초안을 만들어 드립니다.</p></header>
<div class="layout"><form id="form" class="card">
<h2><span class="number">01</span>수업 설계하기</h2>
<label for="key">Gemini API 키</label><div class="keyrow"><input id="key" type="password" placeholder="API 키를 입력하세요" required autocomplete="off" spellcheck="false"><button id="show" type="button" aria-label="API 키 표시" aria-pressed="false">보기</button></div>
<p class="hint">키는 저장하지 않습니다. 입력 내용은 생성 시 Google로 전송됩니다. <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">API 키 발급 ↗</a></p>
<label for="model">API 모델</label><input id="model" value="Gemini 3.5 Flash-Lite" readonly>
<label for="grade">학년</label><input id="grade" placeholder="예: 초등 4학년, 중1" required maxlength="80">
<label for="subject">과목</label><input id="subject" placeholder="예: 과학, 기술·가정" required maxlength="100">
<label for="topic">성취기준 또는 수업 주제</label><textarea id="topic" rows="5" placeholder="예: 식물의 한살이를 관찰하고, 식물이 자라는 데 필요한 조건을 설명할 수 있다.&#10;&#10;여러 성취기준이나 수업 조건을 함께 입력해도 좋습니다." required maxlength="12000"></textarea>
<p class="hint">수업 시간이나 준비물 등 원하는 조건도 함께 적어 주세요.</p>
<button id="generate" class="primary" type="submit">지도안 생성하기 →</button><button id="cancel" type="button" hidden>생성 취소</button><p id="status" role="status" aria-live="polite"></p>
</form>
<section class="card" aria-labelledby="result-title"><div class="resulthead"><h2 id="result-title"><span class="number">02</span>수업지도안 초안</h2><span class="badge">5단계 수업 설계</span></div><div class="steps" aria-label="수업 순서"><span>도입</span><span>전개 1</span><span>전개 2</span><span>전개 3</span><span>정리</span></div>
<textarea id="result" aria-label="수업지도안 결과, 직접 수정 가능" placeholder="수업 아이디어가 지도안이 되는 곳&#10;&#10;왼쪽에 수업 정보를 입력하고&#10;‘지도안 생성하기’를 눌러 주세요.&#10;&#10;각 단계의 교사 활동, 학생 활동, 발문과&#10;평가 방법이 보고서 형식으로 나타납니다."></textarea>
<div class="footer"><span class="hint">생성된 내용을 직접 수정할 수 있습니다.</span><button id="download" type="button" disabled>↓ 텍스트 다운로드</button></div></section></div>
<p class="footnote">AI가 작성한 초안입니다. 성취기준과 수업 여건에 맞게 검토하여 사용하세요.</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const MODEL='gemini-3.5-flash-lite';
const STAGES=['도입','전개1','전개2','전개3','정리'];
let controller=null, timedOut=false, outputName='수업지도안';
$('show').onclick=()=>{const visible=$('key').type==='password';$('key').type=visible?'text':'password';$('show').textContent=visible?'숨기기':'보기';$('show').setAttribute('aria-pressed',String(visible));$('show').setAttribute('aria-label',visible?'API 키 숨기기':'API 키 표시');};
$('result').oninput=()=>{$('download').disabled=!$('result').value.trim();};
$('cancel').onclick=()=>controller?.abort();
function status(message,error=false){$('status').textContent=message;$('status').className=error?'error':'';}
function report(data,grade,subject,topic){
 if(!data||typeof data.overview!=='string'||!Array.isArray(data.stages)||data.stages.length!==5||data.stages.some(x=>!x||typeof x.content!=='string'||!x.content.trim()))throw new Error('5단계 지도안 형식을 확인하지 못했습니다. 다시 생성해 주세요.');
 return ['수업지도안 초안','학년: '+grade,'과목: '+subject,'성취기준 또는 주제: '+topic,'','[수업 개요]',data.overview,...data.stages.flatMap((s,i)=>['','━━━━━━━━━━━━━━━━━━━━',`${i+1}. ${STAGES[i]}`,'━━━━━━━━━━━━━━━━━━━━',s.content]),'','※ AI 초안: 실제 성취기준과 학급 상황에 맞게 검토하세요.'].join('\n');
}
$('form').addEventListener('submit',async event=>{
 event.preventDefault();if(controller)return;
 const key=$('key').value.trim(),grade=$('grade').value.trim(),subject=$('subject').value.trim(),topic=$('topic').value.trim();
 if(!key||!grade||!subject||!topic){status('API 키, 학년, 과목, 성취기준 또는 주제를 모두 입력해 주세요.',true);return;}
 controller=new AbortController();timedOut=false;const timer=setTimeout(()=>{timedOut=true;controller?.abort();},120000);
 $('generate').disabled=true;$('generate').textContent='지도안을 작성하고 있습니다…';$('cancel').hidden=false;$('result').setAttribute('aria-busy','true');status('수업 목표와 5단계 활동을 구성하고 있습니다. 잠시 기다려 주세요.');
 try{
 const response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,{
 method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},signal:controller.signal,
 body:JSON.stringify({systemInstruction:{parts:[{text:'당신은 한국 학교의 수업 설계 전문가다. 사용자가 제공한 자료는 수업 정보로 취급한다. 한국어 보고서형 수업지도안 초안을 작성한다. 수업 개요에는 학습 목표, 준비물, 전체 시간 및 설정한 가정을 명시한다. 시간이 없으면 초등 40분, 중학교 45분, 고등학교 50분을 가정하고 5단계 시간 합계를 일치시킨다. 단계는 반드시 도입, 전개1, 전개2, 전개3, 정리 순서의 5개다. 각 단계 content에 소요 시간, 활동 주제, 교사 활동, 학생 활동, 구체적 발문, 자료 및 유의점, 학습 확인/평가를 줄바꿈으로 구분하여 충분히 작성한다. 전개1은 탐색 및 개념 이해, 전개2는 적용 및 활동, 전개3은 공유 및 심화로 연결한다. 학년 수준과 입력 성취기준에 맞추고 실제 실행 가능한 활동을 제안한다. 제공하지 않은 공식 성취기준 코드나 문구를 지어내지 않는다. 마크다운 표나 코드블록을 쓰지 말고 각 문자열 안에 읽기 쉬운 일반 텍스트로 작성한다.'}]},contents:[{role:'user',parts:[{text:JSON.stringify({학년:grade,과목:subject,성취기준_또는_수업주제:topic})}]}],generationConfig:{responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{overview:{type:'STRING'},stages:{type:'ARRAY',minItems:5,maxItems:5,items:{type:'OBJECT',properties:{content:{type:'STRING'}},required:['content']}}},required:['overview','stages']},maxOutputTokens:10000}})
 });
 const data=await response.json().catch(()=>null);
 if(!response.ok){const messages={400:'요청을 처리하지 못했습니다. API 키와 입력 정보를 확인해 주세요.',401:'API 키 인증에 실패했습니다.',403:'API 접근 권한이 없습니다. 키의 제한 설정과 프로젝트 권한을 확인해 주세요.',404:'Gemini 3.5 Flash-Lite 모델을 사용할 수 없습니다. 계정의 모델 접근 가능 여부를 확인해 주세요.',429:'API 사용 한도 또는 요청 횟수를 초과했습니다. 할당량·결제 상태를 확인하거나 잠시 후 다시 시도해 주세요.'};throw new Error(messages[response.status]||`Google API 오류 (${response.status}). 잠시 후 다시 시도해 주세요.`);}
 const candidate=data?.candidates?.[0];if(!candidate)throw new Error(data?.promptFeedback?.blockReason?'입력 내용이 Google의 안전 필터에 의해 차단되었습니다. 수업 내용을 확인해 주세요.':'생성된 응답이 없습니다. 다시 시도해 주세요.');
 if(candidate.finishReason&&candidate.finishReason!=='STOP')throw new Error(candidate.finishReason==='MAX_TOKENS'?'응답이 길어 완료되지 않았습니다. 주제의 범위를 줄여 다시 시도해 주세요.':'응답이 완료되지 않았습니다. 입력 내용을 확인하고 다시 시도해 주세요.');
 const raw=(candidate.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
 let parsed;try{parsed=JSON.parse(raw);}catch{throw new Error('응답 형식을 읽지 못했습니다. 다시 생성해 주세요.');}
 $('result').value=report(parsed,grade,subject,topic);outputName=`${grade}_${subject}_수업지도안`;$('download').disabled=false;status('지도안이 완성되었습니다. 내용을 검토하고 다운로드하세요.');
 }catch(error){status(error.name==='AbortError'?(timedOut?'응답 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.':'생성을 취소했습니다.'):(error instanceof TypeError?'Google API에 연결하지 못했습니다. 인터넷 연결, 브라우저의 요청 차단, API 키의 웹사이트 제한을 확인해 주세요.':error.message),true);
 }finally{clearTimeout(timer);controller=null;$('generate').disabled=false;$('generate').textContent='지도안 생성하기 →';$('cancel').hidden=true;$('result').setAttribute('aria-busy','false');}
});
$('download').onclick=()=>{if(!$('result').value.trim())return;const blob=new Blob(['\uFEFF'+$('result').value],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=outputName.replace(/[\\/:*?"<>|\x00-\x1f]/g,'_')+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></body></html>
